{% load static polls_extras %}<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kararsızım{% endblock %}</title>
  <meta name="description" content="{% block description %}Sen sor, kalabalık karar versin.{% endblock %}">

  <meta property="og:site_name" content="Kararsızım">
  <meta property="og:locale" content="tr_TR">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{% block og_title %}Kararsızım{% endblock %}">
  <meta property="og:description" content="{% block og_description %}Sen sor, birlikte karar verelim.{% endblock %}">
  <meta property="og:url" content="{{ request.build_absolute_uri }}">
  <meta property="og:image" content="{% static 'img/og.png' as og_image %}{% absolute_url og_image %}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/svg+xml" href="{% static 'img/logo.svg' %}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">

  <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}">
</head>
<body>
  <a class="skip-link" href="#main">Ana içeriğe geç</a>
  {% include "partials/header.html" %}
  <main id="main" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
  {% include "partials/toast.html" %}
  <script src="{% static 'js/toast.js' %}" defer></script>
</body>
</html>
