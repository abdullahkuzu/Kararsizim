{% load static %}<header class="site-header">
  <a class="site-logo" href="{% url 'polls:index' %}">
    <img src="{% static 'img/logo.svg' %}" alt="" width="28" height="28">
    Kararsızım
  </a>
  <nav class="site-nav" aria-label="Ana menü">
    {% if user.is_authenticated %}
      <a class="site-user" href="{% url 'polls:profile' user.username %}">@{{ user.username }}</a>
      <a class="btn btn-primary" href="{% url 'polls:create' %}">Anket oluştur</a>
      <form method="post" action="{% url 'accounts:logout' %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-secondary">Çıkış yap</button>
      </form>
    {% else %}
      <a class="btn btn-secondary" href="{% url 'accounts:login' %}">Giriş yap</a>
      <a class="btn btn-primary" href="{% url 'accounts:register' %}">Kayıt ol</a>
    {% endif %}
  </nav>
</header>
